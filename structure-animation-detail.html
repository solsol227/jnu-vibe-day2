const MAIN_PY = `import os

from fastapi import FastAPI, HTTPException
from fastapi.middleware.cors import CORSMiddleware
from pydantic import BaseModel
from dotenv import load_dotenv
from supabase import create_client

load_dotenv()

# 로컬에선 .env를 읽고, Railway에선 Variables가 이미 들어 있음
SUPABASE_URL = os.environ["SUPABASE_URL"]
SUPABASE_SECRET_KEY = os.environ["SUPABASE_SECRET_KEY"]
FRONT_ORIGINS = [
    o.strip() for o in os.getenv("FRONT_ORIGINS", "").split(",") if o.strip()
]

sb = create_client(SUPABASE_URL, SUPABASE_SECRET_KEY)

app = FastAPI(title="my-api")

app.add_middleware(
    CORSMiddleware,
    allow_origins=FRONT_ORIGINS,
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)


class PlaceIn(BaseModel):
    name: str
    description: str = ""


@app.get("/health")
def health():
    return {"status": "ok"}


@app.get("/health/db")
def health_db():
    """Supabase 연결 + jnu_vc2_places 테이블 존재 확인"""
    try:
        sb.table("jnu_vc2_places").select("id").limit(1).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=f"supabase error: {e}")
    return {"status": "ok", "db": "connected"}


@app.get("/places")
def list_places():
    try:
        res = sb.table("jnu_vc2_places").select("*").order("id", desc=True).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))
    return res.data


@app.post("/places", status_code=201)
def create_place(place: PlaceIn):
    try:
        res = sb.table("jnu_vc2_places").insert(place.model_dump()).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))
    return res.data[0]


@app.delete("/places/{place_id}")
def delete_place(place_id: int):
    try:
        sb.table("jnu_vc2_places").delete().eq("id", place_id).execute()
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))
    return {"deleted": place_id}`;

const $ = id => document.getElementById(id);
let tab = "start", idx = 0, timer = null;

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function renderTabs(){
  $("tabs").innerHTML = "";
  Object.entries(TABS).forEach(([k,v]) => {
    const b = document.createElement("button");
    b.textContent = v.label; b.className = k === tab ? "on" : "";
    b.onclick = () => { stop(); tab = k; idx = 0; renderTabs(); buildStatic(); render(); };
    $("tabs").appendChild(b);
  });
}
function buildStatic(){
  const T = TABS[tab];
  $("intro").textContent = T.intro;
  // flow
  const f = $("flow"); f.innerHTML = "";
  T.nodes.forEach((n, i) => {
    if (i) { const a = document.createElement("div"); a.className = "arrow"; a.id = "a" + i; a.textContent = "➜"; f.appendChild(a); }
    const d = document.createElement("div"); d.className = "node"; d.id = "n" + i;
    d.innerHTML = '<div class="i">' + n[0] + '</div><b>' + n[1] + '</b><small>' + n[2] + '</small>';
    f.appendChild(d);
  });
  // code
  const c = $("code");
  c.innerHTML = '<div class="fname">📄 ' + T.file + '</div>' + T.code.split("\n").map((ln, i) =>
    '<div class="ln" id="L' + (i+1) + '"><span class="n">' + (i+1) + '</span>' + (esc(ln) || " ") + '</div>').join("");
  // dots
  $("dots").innerHTML = "";
  T.steps.forEach((_, i) => { const e = document.createElement("i"); e.onclick = () => { stop(); idx = i; render(); }; $("dots").appendChild(e); });
}
function render(){
  const T = TABS[tab], s = T.steps[idx];
  $("no").textContent = "STEP " + (idx+1) + " / " + T.steps.length;
  $("title").textContent = s.t;
  $("desc").innerHTML = "<p></p>" + (s.x ? '<div class="note"></div>' : "");
  $("desc").children[0].textContent = s.c;
  if (s.x) { const n = $("desc").children[1]; n.style.whiteSpace = "pre-wrap"; n.textContent = "💡 " + s.x; }
  $("carry").textContent = s.carry ? "📦 " + s.carry : "";
  // flow
  T.nodes.forEach((_, i) => {
    $("n"+i).className = "node" + (i === s.n ? " active" : (i < s.n ? " done" : ""));
    if (i) $("a"+i).className = "arrow" + (i === s.n ? " on" : "");
  });
  // code highlight
  document.querySelectorAll(".ln.hl").forEach(e => e.classList.remove("hl"));
  let first = null;
  s.l.forEach(([a,b]) => { for (let i = a; i <= b; i++) { const e = $("L"+i); if (e) { e.classList.add("hl"); if (!first) first = e; } } });
  if (first) { const box = $("code"); box.scrollTo({ top: Math.max(0, first.offsetTop - 60), behavior: "smooth" }); }
  else $("code").scrollTo({ top: 0, behavior: "smooth" });
  [...$("dots").children].forEach((d,i) => d.classList.toggle("on", i === idx));
}
function go(n){ const L = TABS[tab].steps.length; idx = (n + L) % L; render(); }
function stop(){ clearInterval(timer); timer = null; $("play").textContent = "▶ 자동 재생"; }
function start(){ $("play").textContent = "⏸ 멈춤"; timer = setInterval(() => { if (idx >= TABS[tab].steps.length - 1) stop(); else go(idx + 1); }, 5000); }
$("prev").onclick = () => { stop(); go(idx - 1); };
$("next").onclick = () => { stop(); go(idx + 1); };
$("play").onclick = () => { if (timer) stop(); else { if (idx >= TABS[tab].steps.length - 1) { idx = 0; render(); } start(); } };
renderTabs(); buildStatic(); render();
</script>
